# SPDX-License-Identifier: Apache-2.0
name: API Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: studio-deploy

      - uses: actions/checkout@v4
        with:
          repository: complytime-labs/complytime-studio
          path: complytime-studio

      - name: Build and start headless stack
        working-directory: studio-deploy
        run: |
          docker compose \
            -f docker-compose.yaml \
            -f docker-compose.headless.yaml \
            up -d --build gateway postgres nats

      - name: Wait for gateway health
        working-directory: studio-deploy
        run: |
          echo "Waiting for gateway /healthz..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz > /dev/null 2>&1; then
              echo "Gateway healthy after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:8080/healthz || (echo "Gateway not healthy" && exit 1)

      - name: Run headless API tests
        working-directory: studio-deploy
        run: ./test-headless.sh

      - name: Run Helm headless validation
        working-directory: studio-deploy
        run: make test-helm-headless

      - name: Collect logs on failure
        if: failure()
        working-directory: studio-deploy
        run: docker compose logs --no-color > /tmp/compose-logs.txt 2>&1

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: /tmp/compose-logs.txt

      - name: Tear down
        if: always()
        working-directory: studio-deploy
        run: docker compose down -v
