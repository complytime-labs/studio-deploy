# SPDX-License-Identifier: Apache-2.0
#
# E2E tests run against a Kind cluster with Helm. Triggered manually
# or on push to main (not on every PR — too slow for CI).
name: E2E Tests

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GATEWAY_URL: http://localhost:8080
  SEED_IDENTITY: e2e-test@complytime.dev

jobs:
  # ── Helm template validation (fast, runs on PRs via api-tests.yaml) ──
  # This workflow focuses on live cluster tests.

  # ── Kind integration tests ──
  kind-smoke:
    name: Kind Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Kind
        uses: helm/kind-action@v1
        with:
          cluster_name: complytime
          config: kind.yaml

      - name: Install Helm
        uses: azure/setup-helm@v4

      - uses: actions/checkout@v4
        with:
          repository: complytime-labs/complytime-core
          path: _core

      - name: Build gateway image
        run: |
          docker build -t studio-gateway:latest -f _core/Dockerfile.gateway _core
          kind load docker-image studio-gateway:latest --name complytime

      - name: Build complytime-mcp image
        run: |
          docker build -t complytime-mcp:latest -f _core/Dockerfile.mcp _core
          kind load docker-image complytime-mcp:latest --name complytime

      - name: Deploy with Helm (dev, no auth)
        run: |
          helm install studio charts/complytime \
            -n complytime --create-namespace \
            -f charts/complytime/values-dev.yaml

      - name: Wait for pods
        run: |
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/part-of=complytime-studio \
            -n complytime --timeout=120s || true
          kubectl get pods -n complytime

      - name: Smoke test gateway
        run: |
          kubectl port-forward -n complytime svc/studio-gateway 8080:8080 &
          sleep 3
          curl -sf http://localhost:8080/healthz
          echo " Gateway healthy"

      - name: Helm headless validation
        run: make test-helm-headless

      - name: Collect logs on failure
        if: failure()
        run: |
          kubectl logs -n complytime -l app.kubernetes.io/part-of=complytime-studio \
            --all-containers --tail=50 > /tmp/kind-logs.txt 2>&1
          kubectl get pods -n complytime -o wide >> /tmp/kind-logs.txt

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kind-logs
          path: /tmp/kind-logs.txt

      - name: Tear down
        if: always()
        run: kind delete cluster --name complytime
