# SPDX-License-Identifier: Apache-2.0
#
# Unified E2E test workflow — runs API, UI, and agent tests against
# a full Compose stack. Triggered manually or on push/PR.
name: E2E Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GATEWAY_URL: http://localhost:8080
  SEED_IDENTITY: e2e-test@complytime.dev

jobs:
  # ── Layer 1: API Surface ──
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: studio-deploy

      - uses: actions/checkout@v4
        with:
          repository: complytime/complytime-studio
          path: complytime-studio

      - name: Start headless stack
        working-directory: studio-deploy
        run: |
          docker compose \
            -f docker-compose.yaml \
            -f docker-compose.headless.yaml \
            up -d --build gateway postgres nats

      - name: Wait for gateway health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz > /dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:8080/healthz

      - name: Run headless API tests
        working-directory: studio-deploy
        run: ./test-headless.sh

      - name: Run Helm headless validation
        working-directory: studio-deploy
        run: make test-helm-headless

      - name: Collect logs on failure
        if: failure()
        working-directory: studio-deploy
        run: docker compose logs --no-color > /tmp/api-logs.txt 2>&1

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-logs
          path: /tmp/api-logs.txt

      - name: Tear down
        if: always()
        working-directory: studio-deploy
        run: docker compose down -v

  # ── Layer 2: UI Smoke Tests ──
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: studio-deploy

      - uses: actions/checkout@v4
        with:
          repository: complytime/complytime-studio
          path: complytime-studio

      - uses: actions/checkout@v4
        with:
          repository: complytime/studio-ui
          path: studio-ui

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio-ui/package-lock.json

      - name: Install UI dependencies
        working-directory: studio-ui
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        working-directory: studio-ui
        run: npx playwright install --with-deps chromium

      - name: Start full stack (gateway + UI)
        working-directory: studio-deploy
        run: docker compose up -d --build gateway postgres nats studio

      - name: Wait for gateway and UI health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz > /dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:8080/healthz
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000/ > /dev/null 2>&1 && break
            sleep 1
          done

      - name: Run Playwright E2E tests
        working-directory: studio-ui
        run: npx playwright test
        env:
          BASE_URL: http://localhost:3000
          GATEWAY_URL: http://localhost:8080

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: studio-ui/playwright-report/

      - name: Collect logs on failure
        if: failure()
        working-directory: studio-deploy
        run: docker compose logs --no-color > /tmp/ui-logs.txt 2>&1

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-logs
          path: /tmp/ui-logs.txt

      - name: Tear down
        if: always()
        working-directory: studio-deploy
        run: docker compose down -v

  # ── Layer 3: Agent Tests ──
  agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: complytime/complytime-agents
          path: complytime-agents

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: complytime-agents/agents/assistant/requirements-dev.txt

      - name: Install dependencies
        working-directory: complytime-agents
        run: pip install -r agents/assistant/requirements-dev.txt

      - name: Run unit tests (callbacks)
        working-directory: complytime-agents/agents/assistant
        run: python -m pytest -v

      - name: Run workbench integration tests
        working-directory: complytime-agents
        run: python -m pytest tests/ -v --ignore=tests/test_a2a_contract.py
