# SPDX-License-Identifier: Apache-2.0
{{- if .Values.studio.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: studio-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: studio-ui
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.studio.service.type | default "ClusterIP" }}
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
      {{- if .Values.studio.service.nodePort }}
      nodePort: {{ .Values.studio.service.nodePort }}
      {{- end }}
  selector:
    app.kubernetes.io/name: studio-ui
{{- end }}
