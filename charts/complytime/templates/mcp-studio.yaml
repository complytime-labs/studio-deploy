# SPDX-License-Identifier: Apache-2.0
#
# complytime-mcp — read-only evidence data access for agents.
# Proxies to the gateway via REST (GATEWAY_URL), not directly to Postgres.
{{- if and .Values.kagent.crdsAvailable .Values.postgres.enabled .Values.mcpServers.studio.enabled }}
---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: complytime-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "studio.labels" . | nindent 4 }}
spec:
  transportType: stdio
  stdioTransport: {}
  deployment:
    image: {{ .Values.mcpServers.studio.image.repository }}:{{ .Values.mcpServers.studio.image.tag }}
    cmd: /complytime-mcp
    port: 3000
    env:
      GATEWAY_URL: "http://studio-gateway:8080"
{{- end }}
