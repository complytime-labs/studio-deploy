{{- if .Values.postgres.enabled }}
# SPDX-License-Identifier: Apache-2.0
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: studio-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "studio.labels" . | nindent 4 }}
    {{- include "studio.selectorLabels" (dict "component" "postgres" "root" .) | nindent 4 }}
spec:
  serviceName: studio-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "studio.selectorLabels" (dict "component" "postgres" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "studio.labels" . | nindent 8 }}
        {{- include "studio.selectorLabels" (dict "component" "postgres" "root" .) | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          ports:
            - containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.auth.user | quote }}
            - name: POSTGRES_PASSWORD
              {{- if .Values.postgres.auth.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.auth.existingSecret }}
                  key: password
              {{- else }}
              value: {{ .Values.postgres.auth.password | quote }}
              {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.auth.user | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.auth.user | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: initdb
          secret:
            secretName: studio-postgres-initdb
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: studio-postgres-initdb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "studio.labels" . | nindent 4 }}
stringData:
  01-schemas-and-roles.sql: |
    CREATE SCHEMA IF NOT EXISTS workbench;

    -- Gateway role: full access to public schema only
    DO $$ BEGIN
      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ .Values.postgres.auth.gatewayUser }}') THEN
        CREATE ROLE {{ .Values.postgres.auth.gatewayUser }} LOGIN PASSWORD '{{ .Values.postgres.auth.gatewayPassword }}';
      ELSE
        ALTER ROLE {{ .Values.postgres.auth.gatewayUser }} PASSWORD '{{ .Values.postgres.auth.gatewayPassword }}';
      END IF;
    END $$;
    GRANT ALL ON SCHEMA public TO {{ .Values.postgres.auth.gatewayUser }};
    ALTER DEFAULT PRIVILEGES IN SCHEMA public
      GRANT ALL ON TABLES TO {{ .Values.postgres.auth.gatewayUser }};
    ALTER DEFAULT PRIVILEGES IN SCHEMA public
      GRANT ALL ON SEQUENCES TO {{ .Values.postgres.auth.gatewayUser }};

    -- Workbench role: full access to workbench schema, no access to public
    DO $$ BEGIN
      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ .Values.postgres.auth.workbenchUser }}') THEN
        CREATE ROLE {{ .Values.postgres.auth.workbenchUser }} LOGIN PASSWORD '{{ .Values.postgres.auth.workbenchPassword }}';
      ELSE
        ALTER ROLE {{ .Values.postgres.auth.workbenchUser }} PASSWORD '{{ .Values.postgres.auth.workbenchPassword }}';
      END IF;
    END $$;
    GRANT ALL ON SCHEMA workbench TO {{ .Values.postgres.auth.workbenchUser }};
    ALTER DEFAULT PRIVILEGES IN SCHEMA workbench
      GRANT ALL ON TABLES TO {{ .Values.postgres.auth.workbenchUser }};
    ALTER DEFAULT PRIVILEGES IN SCHEMA workbench
      GRANT ALL ON SEQUENCES TO {{ .Values.postgres.auth.workbenchUser }};

    -- Cross-schema isolation: revoke workbench access to public schema
    REVOKE ALL ON SCHEMA workbench FROM {{ .Values.postgres.auth.gatewayUser }};
    REVOKE ALL ON SCHEMA public FROM {{ .Values.postgres.auth.workbenchUser }};

    -- Read-only role for external dashboard clients (Grafana, Metabase)
    DO $$ BEGIN
      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ .Values.postgres.auth.readerUser }}') THEN
        CREATE ROLE {{ .Values.postgres.auth.readerUser }} LOGIN PASSWORD '{{ .Values.postgres.auth.readerPassword }}';
      ELSE
        ALTER ROLE {{ .Values.postgres.auth.readerUser }} PASSWORD '{{ .Values.postgres.auth.readerPassword }}';
      END IF;
    END $$;
    GRANT USAGE ON SCHEMA public TO {{ .Values.postgres.auth.readerUser }};
    GRANT SELECT ON ALL TABLES IN SCHEMA public TO {{ .Values.postgres.auth.readerUser }};
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO {{ .Values.postgres.auth.readerUser }};
    GRANT USAGE ON SCHEMA workbench TO {{ .Values.postgres.auth.readerUser }};
    GRANT SELECT ON ALL TABLES IN SCHEMA workbench TO {{ .Values.postgres.auth.readerUser }};
    ALTER DEFAULT PRIVILEGES IN SCHEMA workbench GRANT SELECT ON TABLES TO {{ .Values.postgres.auth.readerUser }};
---
apiVersion: v1
kind: Service
metadata:
  name: studio-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "studio.labels" . | nindent 4 }}
    {{- include "studio.selectorLabels" (dict "component" "postgres" "root" .) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "studio.selectorLabels" (dict "component" "postgres" "root" .) | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
{{- end }}
