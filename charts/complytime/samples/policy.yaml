# SPDX-License-Identifier: Apache-2.0
# Sample Gemara Policy — Container Security Baseline
# References the SEC.SLAM.CM control catalog for effective control resolution.

title: Container Security Baseline

metadata:
  id: container-security-baseline
  type: Policy
  description: |
    Baseline security policy for container workloads. Imports controls
    from the SEC.SLAM.CM control catalog and defines inline criteria
    for image provenance and runtime isolation.
  version: 1.0.0
  author:
    id: complytime-samples
    name: ComplyTime Samples
    type: Human

imports:
  catalogs:
    - reference-id: SEC.SLAM.CM
      include:
        - SEC.SLAM.CM.CTL01
        - SEC.SLAM.CM.CTL02

criteria:
  - id: CSB.CR01
    title: Image Provenance Attestation
    objective: |
      All container images deployed to production must have a verifiable
      build provenance attestation from the CI/CD pipeline.
    assessment-requirements:
      - id: CSB.CR01.AR01
        text: |
          The deployment pipeline MUST verify that each container image
          has a signed SLSA provenance attestation at level 2 or higher
          before scheduling it to production clusters.
      - id: CSB.CR01.AR02
        text: |
          The provenance attestation MUST reference the source repository,
          commit SHA, and build system that produced the image.
  - id: CSB.CR02
    title: Runtime Isolation
    objective: |
      Container workloads must run with minimal privileges and namespace
      isolation to limit blast radius of a compromise.
    assessment-requirements:
      - id: CSB.CR02.AR01
        text: |
          Containers MUST run as a non-root user unless an explicit
          exception is documented and approved.
      - id: CSB.CR02.AR02
        text: |
          Containers MUST drop all Linux capabilities and only add back
          those explicitly required by the workload.
      - id: CSB.CR02.AR03
        text: |
          Pod security admission MUST enforce the restricted policy
          for all production namespaces.
