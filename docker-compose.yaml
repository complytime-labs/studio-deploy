#
# Minimal infrastructure for local development (go run / python debugging).
# For the full stack, use Kind + Helm:
#
#   make kind-reset
#   make helm-dev-auth OIDC_ISSUER=... OIDC_CLIENT_ID=... OIDC_CLIENT_SECRET=...

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: complytime-dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro

  nats:
    image: nats:2-alpine
    ports:
      - "4222:4222"

volumes:
  pgdata:
