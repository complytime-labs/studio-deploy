version: v2
plugins:
  # Go server + client stubs (remote buf plugins)
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: gen/go
    opt: paths=source_relative
  # Python stubs: generate locally with grpcio-tools to match
  # the installed protobuf runtime version. Run:
  #   python -m grpc_tools.protoc -I. \
  #     --python_out=gen/python --grpc_python_out=gen/python \
  #     complytime/v1/*.proto
